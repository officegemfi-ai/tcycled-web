<div class="poster poster--ever" data-poster="hoodie">
  <div class="poster__in">
    <div class="poster__top">{{logo}}<span>#<span class="en">notgoodbye</span><span class="de">keinAbschied</span></span></div>
    <h3><span class="en">You were there for everything.</span><span class="de">Du warst immer für mich da.</span></h3>
    <div class="poster__art" style="--rot:7deg">{{i:hoodie}}<svg class="loopline" viewBox="0 0 100 100" style="transform:rotate(-8deg) scaleX(-1)" aria-hidden="true" focusable="false">{{loopline}}</svg></div>
    <p class="poster__sub"><span class="en">Now be there for someone else.</span><span class="de">Jetzt bist du für jemand anderen da.</span></p>
    <div class="poster__foot">
      <span class="poster__sign"><span class="en">It's not goodbye.</span><span class="de">Kein Abschied.</span></span>
      <span class="poster__get"><span class="poster__cta"><span class="en">Here's how</span><span class="de">So geht’s</span></span>{{qr:app}}</span>
    </div>
  </div>
</div>
