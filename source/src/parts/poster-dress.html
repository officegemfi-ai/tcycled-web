<div class="poster poster--coral" data-poster="dress">
  <div class="poster__in">
    <div class="poster__top">{{logo}}<span>#<span class="en">notgoodbye</span><span class="de">keinAbschied</span></span></div>
    <h3><span class="en">Let's see other people.</span><span class="de">Zeit für jemand Neues.</span></h3>
    <div class="poster__art" style="--rot:-6deg">{{i:dress}}<svg class="loopline" viewBox="0 0 100 100" style="transform:rotate(40deg)" aria-hidden="true" focusable="false">{{loopline}}</svg></div>
    <p class="poster__sub"><span class="en">It still has Saturdays ahead. Just not with you.</span><span class="de">Es hat noch viele Samstage vor sich. Nur nicht mit dir.</span></p>
    <div class="poster__foot">
      <span class="poster__sign"><span class="en">It's not goodbye.</span><span class="de">Kein Abschied.</span></span>
      <span class="poster__get"><span class="poster__cta"><span class="en">Here's how</span><span class="de">So geht’s</span></span>{{qr:app}}</span>
    </div>
  </div>
</div>
