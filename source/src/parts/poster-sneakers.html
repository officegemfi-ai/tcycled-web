<div class="poster poster--sprout" data-poster="sneakers">
  <div class="poster__in">
    <div class="poster__top">{{logo}}<span>#<span class="en">notgoodbye</span><span class="de">keinAbschied</span></span></div>
    <h3><span class="en">We had a good run.</span><span class="de">Wir hatten eine schöne Zeit.</span></h3>
    <div class="poster__art" style="--rot:-10deg">{{i:sneaker}}<svg class="loopline" viewBox="0 0 100 100" style="transform:rotate(14deg)" aria-hidden="true" focusable="false">{{loopline}}</svg></div>
    <p class="poster__sub"><span class="en">Now they can go another round.</span><span class="de">Jetzt können sie noch eine Runde drehen.</span></p>
    <div class="poster__foot">
      <span class="poster__sign"><span class="en">It's not goodbye.</span><span class="de">Kein Abschied.</span></span>
      <span class="poster__get"><span class="poster__cta"><span class="en">Here's how</span><span class="de">So geht’s</span></span>{{qr:app}}</span>
    </div>
  </div>
</div>
